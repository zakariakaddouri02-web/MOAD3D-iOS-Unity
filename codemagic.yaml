workflows:
  ios-build:
    name: MOAD 3D Scan iOS (native Swift)
    max_build_duration: 120
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: MOAD3D.xcodeproj
        XCODE_SCHEME: MOAD3D
        BUNDLE_ID: com.moad.moad3dscan
    scripts:
      - name: Build unsigned iOS archive
        script: |
          set -e
          mkdir -p build
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/MOAD3D.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
      - name: Package unsigned IPA for AltServer
        script: |
          set -e
          APP_PATH="$(find build/MOAD3D.xcarchive/Products/Applications -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          /usr/bin/zip -qry ../MOAD3D-unsigned.ipa Payload
    artifacts:
      - build/MOAD3D-unsigned.ipa
