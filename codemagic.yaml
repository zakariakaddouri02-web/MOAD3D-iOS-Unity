workflows:
  ios-build:
    name: MOAD 3D Scan iOS (unsigned)
    max_build_duration: 120
    environment:
      unity: 2022.3.11f1
      xcode: latest
      groups:
        - unity_credentials
      vars:
        BUNDLE_ID: com.moad.moad3dscan
        UNITY_IOS_DIR: build/ios
        XCODE_PROJECT: Unity-iPhone.xcodeproj
        XCODE_SCHEME: Unity-iPhone
    scripts:
      - name: Activate Unity license
        script: |
          "$UNITY_HOME/Contents/MacOS/Unity" -batchmode -quit -logFile - \
            -serial "$UNITY_SERIAL" \
            -username "$UNITY_EMAIL" \
            -password "$UNITY_PASSWORD"
      - name: Generate the iOS Xcode project
        script: |
          "$UNITY_HOME/Contents/MacOS/Unity" -batchmode -quit -nographics -logFile - \
            -projectPath . \
            -executeMethod BuildScript.BuildIOS
      - name: Build unsigned iOS app
        script: |
          xcodebuild \
            -project "$UNITY_IOS_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/MOAD3D.xcarchive \
            archive CODE_SIGNING_ALLOWED=NO
      - name: Package unsigned IPA for AltStore
        script: |
          APP_PATH="$(find build/MOAD3D.xcarchive/Products/Applications -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          /usr/bin/zip -qry ../MOAD3D-unsigned.ipa Payload
    artifacts:
      - build/MOAD3D-unsigned.ipa
